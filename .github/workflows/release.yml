name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the zip to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the version number from the release tag
        env:
          # Passed as an environment variable, never pasted into the script,
          # so a tag name can't inject shell commands.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          yq -i -o json '.version = strenv(TAG)' custom_components/contact_energy/manifest.json

      - name: Zip the integration
        run: |
          cd custom_components/contact_energy
          zip contact_energy.zip -r ./

      - name: Upload the zip to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: custom_components/contact_energy/contact_energy.zip
